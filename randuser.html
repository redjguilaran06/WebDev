<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="randuser.css"> 
    <script src="randuser.js"> </script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Red's Random User Generator</h1>
        </header>
        <div class="error" id="errorMessage"></div>
        <div class="search-container">
            <input type="number" id="userCount" min="0" max="1000" placeholder="Enter number of random users (0-1000)">
            <button id="generateBtn">Generate Users</button>
        </div>
        
        <div class="table-container">
         <table id="usersTable">
            <thead>
             <tr>
                <th>
                   <div class="name-header">
                          Name
                         <select id="nameFormat">
                            <option value="first">First</option>
                             <option value="last">Last</option>
                          </select>
                      </div>
                 </th>
                <th>Gender</th>
                 <th>Email Address</th>
                 <th>Country</th>
               </tr>
         </thead>
             <tbody id="usersBody">
                  <tr>
                    <td colspan="4">
                     <div class="loading">Loading users...</div>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
    </div>
   
    <div class="video-bg">
        <video autoplay muted loop>
            <source src="Social Media Network Animation -  4K Social Media Background Video Green Screen copy.mp4" type="video/mp4">
        </video>
    </div>

</body>
</html>
