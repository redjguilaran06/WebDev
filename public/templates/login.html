<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="auth-card card slide-in-left p-4 mt-5">
            <div class="card-body">
                <h1 class="text-center mb-4 pulse">Login</h1>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">Email</label>
                        <input type="email" id="loginEmail" class="form-control form-control-cool" required>
                    </div>
                    <div class="mb-4">
                        <label for="loginPassword" class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-control form-control-cool" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-cool btn-lg">
                            <span class="btn-text">Confirm</span>
                            <span class="loading-dots" style="display: none;">Loading</span>
                        </button>
                    </div>
                   
                </form>
            </div>
        </div>
    </div>
</div>
