<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="auth-card card slide-in-right p-4 mt-4">
            <div class="card-body">
                <h1 class="text-center mb-4 pulse">Sign Up Here</h1>
                <form id="signupForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" id="firstName" class="form-control form-control-cool" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" id="lastName" class="form-control form-control-cool" required>
                        </div>
                    </div>
                    <div class="row" id="BD">
                        <h5>Birthdate</h5>
                        <div class="col"><input class="form-label" id="birthdate" type="date"></div>
                    </div>
                    <div class="mb-3">
                        <label for="signupEmail" class="form-label">Email</label>
                        <input type="email" id="signupEmail" class="form-control form-control-cool" required>
                    </div>
                    <div class="mb-3">
                        <label for="signupPassword" class="form-label">Password</label>
                        <input type="password" id="signupPassword" class="form-control form-control-cool" required>
                    </div>
                    <div class="mb-4">
                        <label for="repassword" class="form-label">Confirm Password</label>
                        <input type="password" id="repassword" class="form-control form-control-cool" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-cool btn-success-cool btn-lg">
                            <span class="btn-text">Create Account</span>
                            <span class="loading-dots" style="display: none;">Loading</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
